<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060e1e"><title>S-ATHLETIC / NIGHT STAGE</title><link rel="stylesheet" href="/src/night/style.css"></head><body>
<canvas id="arena" aria-label="夜の3Dアスレチック会場"></canvas>
<header><a href="/" class="brand">N<span>ATHLETIC</span></a><span id="stageLabel"></span><nav><button id="camera" aria-label="カメラ切り替え">視点</button><button id="help">操作</button><button id="pause" aria-label="一時停止">Ⅱ</button><a href="/" aria-label="ステージ選択へ">⌂</a></nav></header>
<section id="hud" aria-live="off"><div><small id="areaNum"></small><h1 id="areaName"></h1><p id="areaEn"></p></div><div class="clock"><small id="clockLabel">TIME REMAINING</small><b id="timer"></b></div><div class="grip"><small>筋持久力 <span id="gripValue"></span></small><div><i id="gripFill"></i></div></div></section>
<div id="salmonGauge" role="progressbar" aria-label="サーモンラダーのチャージ" aria-valuemin="0" aria-valuemax="100" hidden><small id="chargeHint">90〜100%で指を離す</small><b id="salmonValue">0%</b><div><i id="salmonFill"></i><em></em></div></div><div id="progress"><i></i></div><p id="hint"></p><div id="telemetry"><span id="state"></span><span id="charge"></span></div>
<div id="controls"><div class="arrows"><button data-input="forward" aria-label="前進・登る">▲</button><button data-input="left" aria-label="左へ重心移動">◀</button><button data-input="back" aria-label="後退・下る・ブレーキ">▼</button><button data-input="right" aria-label="右へ重心移動">▶</button></div><div class="actions"><button data-input="jump" id="jump"><span id="jumpLabel">JUMP</span><small>タップで動作</small></button><button data-input="descend" id="spiderDown" hidden>下降<small>下の板へ / Q</small></button><button data-input="hold" id="hold">HOLD<small>保持・持ち上げる</small></button></div></div>
<video id="finalBgm" width="1" height="1" muted playsinline preload="none" aria-hidden="true" tabindex="-1" disablepictureinpicture></video>
<section id="finalIntro" aria-label="FINAL 入場演出" hidden><p id="introCaption"></p><small id="bgmStatus" role="status" aria-live="polite"></small><button id="retryBgm" hidden>BGMを再生</button><button id="skipIntro">演出スキップ <span aria-hidden="true">↠</span></button></section>
<div id="finalCountdown" role="status" aria-live="assertive" aria-atomic="true" hidden></div>
<dialog id="panel"><div id="panelContent"></div></dialog><div id="toast" role="status"></div><div id="error" hidden role="alert"></div>
<script type="module" src="/src/night/app.mjs"></script></body></html>
